<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>三國群英傳－霸王之業｜關羽鎮城爭霸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0705;
  font-family:"Noto Serif TC","Microsoft JhengHei","PingFang TC",serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---------- 舞台：720x1280 等比縮放置中 ---------- */
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;
  transform-origin:50% 50%;overflow:hidden;background:#0a0705}
#bg{position:absolute;inset:-4%;background:url("{{BG}}") center/cover no-repeat;
  animation:bgdrift 26s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:scale(1.04) translateY(0)}to{transform:scale(1.12) translateY(-18px)}}
#vig{position:absolute;inset:0;background:
  radial-gradient(120% 62% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.66) 100%),
  linear-gradient(180deg,rgba(8,5,3,.9) 0%,rgba(8,5,3,.15) 24%,rgba(8,5,3,.2) 52%,rgba(8,5,3,.96) 100%)}

/* ---------- 頂部 HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;padding:20px 24px 0;z-index:20}
.row{display:flex;align-items:center;gap:12px}
.coinbox{flex:1;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(30,19,8,.94),rgba(12,8,4,.94));
  border:2px solid #b8862f;border-radius:46px;padding:11px 24px;
  box-shadow:0 0 0 1px rgba(255,225,150,.25) inset,0 8px 22px rgba(0,0,0,.6)}
.coin{width:50px;height:50px;flex:0 0 50px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff6c9 0%,#f5c33c 45%,#b4761a 100%);
  border:2px solid #7a4a0c;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:28px;color:#7a4a0c;text-shadow:0 1px 0 rgba(255,255,255,.6);
  animation:spin 2.6s linear infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
#gold{font-size:50px;font-weight:900;letter-spacing:1px;line-height:1;
  color:#ffe9a8;text-shadow:0 2px 0 #6b3d06,0 0 24px rgba(255,196,60,.55)}
#rate{font-size:22px;font-weight:700;color:#8ee08a;text-shadow:0 1px 3px #000;white-space:nowrap}
.lvbox{flex:0 0 auto;text-align:center;
  background:linear-gradient(180deg,#7d1717,#3c0808);border:2px solid #d8a33d;
  border-radius:16px;padding:7px 16px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.lvbox b{display:block;font-size:36px;color:#ffe9a8;line-height:1;text-shadow:0 2px 0 #4a1010}
.lvbox i{font-style:normal;font-size:18px;color:#e9c07a;letter-spacing:2px}

#xpwrap{margin-top:12px}
.xplabel{display:flex;justify-content:space-between;font-size:21px;font-weight:700;
  color:#e9d5a8;text-shadow:0 1px 3px #000;margin-bottom:5px;padding:0 4px}
.xplabel .pw{color:#ffb98a}
#xpbar{height:18px;border-radius:12px;background:rgba(0,0,0,.66);
  border:2px solid #a37b2c;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#xpfill{height:100%;width:0%;border-radius:10px;
  background:linear-gradient(90deg,#ffb63c,#ffe9a8 60%,#fff8dd);
  box-shadow:0 0 16px rgba(255,190,70,.9);transition:width .35s ease}

/* ---------- 對話框（軍師諫言風） ---------- */
#talk{position:absolute;left:36px;right:36px;top:222px;z-index:18;
  background:linear-gradient(180deg,rgba(34,22,10,.93),rgba(12,8,4,.95));
  border:2px solid #c99a3c;border-radius:18px;padding:16px 24px 20px;
  box-shadow:0 0 0 1px rgba(255,230,170,.22) inset,0 12px 30px rgba(0,0,0,.6);
  animation:talkin .4s ease}
@keyframes talkin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#talk::after{content:"";position:absolute;left:50%;bottom:-15px;margin-left:-15px;
  width:0;height:0;border:15px solid transparent;border-top-color:#c99a3c;border-bottom:0}
#talk::before{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-13px;
  width:0;height:0;border:13px solid transparent;border-top-color:#150d05;border-bottom:0;z-index:1}
.talkhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.talkhead .nm{font-size:29px;font-weight:900;color:#ffe9a8;letter-spacing:5px;
  text-shadow:0 2px 0 #5a2a08}
.talkhead .seal{font-size:19px;color:#0f0a04;background:linear-gradient(180deg,#f5c33c,#b4761a);
  border-radius:6px;padding:2px 9px;font-weight:900;letter-spacing:2px}
.talkhead .pw{margin-left:auto;font-size:21px;font-weight:700;color:#ff9c6e}
#talkTxt{font-size:29px;line-height:1.42;color:#f3e5c6;letter-spacing:1px;
  text-shadow:0 2px 4px rgba(0,0,0,.8);min-height:82px}

/* ---------- 角色 ---------- */
#hero{position:absolute;left:50%;bottom:196px;width:620px;
  transform:translateX(-50%);z-index:10;cursor:pointer}
#hero img{width:100%;display:block;
  filter:drop-shadow(0 22px 34px rgba(0,0,0,.8));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-15px) rotate(.4deg)}}
#hero.hit img{animation:hit .32s ease}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.045) translateY(-10px)}100%{transform:scale(1)}}
#aura{position:absolute;left:50%;bottom:230px;width:540px;height:120px;transform:translateX(-50%);
  z-index:9;background:radial-gradient(50% 50% at 50% 50%,rgba(255,190,60,.4),rgba(255,150,30,0) 70%);
  filter:blur(2px);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:translateX(-50%) scale(.95)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}

/* 開場點擊引導 */
#tapGuide{position:absolute;left:50%;bottom:498px;transform:translateX(-50%);
  z-index:19;pointer-events:none;text-align:center}
#tapGuide.hide{display:none}
#tapGuide .rings{position:relative;width:150px;height:150px;margin:0 auto}
#tapGuide .rings i{position:absolute;inset:0;border-radius:50%;
  border:5px solid rgba(255,214,110,.95);box-shadow:0 0 26px rgba(255,190,60,.85);
  animation:tapring 1.5s ease-out infinite}
#tapGuide .rings i:nth-child(2){animation-delay:.5s}
#tapGuide .rings i:nth-child(3){animation-delay:1s}
@keyframes tapring{0%{transform:scale(.42);opacity:1}100%{transform:scale(1.1);opacity:0}}
#tapGuide .hand{position:absolute;left:50%;top:50%;width:78px;margin:-30px 0 0 -30px;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.85));animation:tapping 1.1s ease-in-out infinite}
@keyframes tapping{0%,100%{transform:translate(0,0) scale(1)}
  45%{transform:translate(-8px,-20px) scale(.9)}}
#tapGuide .txt{margin-top:14px;font-size:34px;font-weight:900;color:#ffe9a8;letter-spacing:4px;
  text-shadow:0 3px 0 #7a3c06,0 0 22px rgba(255,190,60,.9);animation:blink 1.2s ease-in-out infinite}

/* COMBO */
#combo{position:absolute;right:32px;bottom:496px;z-index:19;text-align:right;
  pointer-events:none;opacity:0;transition:opacity .18s}
#combo.on{opacity:1}
#combo .n{display:block;font-size:82px;font-weight:900;color:#fff;line-height:.92;
  text-shadow:0 4px 0 #a2540a,0 0 34px rgba(255,190,60,.95)}
#combo .l{display:block;font-size:25px;font-weight:900;color:#ffd166;letter-spacing:5px;
  text-shadow:0 2px 4px #000}
#combo.pop .n{animation:cpop .2s ease}
@keyframes cpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
#rate.hot{color:#ffd166;text-shadow:0 1px 3px #000,0 0 18px rgba(255,190,60,.9)}

/* 飄字 */
.float{position:absolute;z-index:30;font-size:40px;font-weight:900;color:#ffe27a;
  white-space:nowrap;text-shadow:0 2px 0 #6b3d06,0 0 14px rgba(255,190,60,.8);
  pointer-events:none;animation:fly 1s ease-out forwards}
.float.small{font-size:31px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-24px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-150px) scale(1)}}
.float.red{color:#ff8f7a;text-shadow:0 2px 0 #5a0f0f,0 0 14px rgba(255,80,60,.8)}

/* ---------- 底部按鈕 ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 34px 34px;z-index:22}
#tapHint{width:fit-content;margin:0 auto 12px;padding:5px 22px;border-radius:20px;
  background:rgba(8,5,3,.62);text-align:center;font-size:23px;font-weight:700;color:#f0dcae;
  text-shadow:0 2px 6px #000;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
#subrow{display:flex;gap:14px;margin-bottom:14px}
.sub{position:relative;flex:1;height:98px;border:2px solid #c99a3c;border-radius:16px;
  background:linear-gradient(180deg,rgba(46,30,12,.96),rgba(16,10,5,.96));
  font-family:inherit;cursor:pointer;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,230,170,.18) inset,0 8px 0 #2a1a08,0 12px 24px rgba(0,0,0,.6)}
.sub:active{transform:translateY(5px);box-shadow:0 0 0 1px rgba(255,230,170,.18) inset,0 3px 0 #2a1a08}
.sub .t{display:block;font-size:36px;font-weight:900;color:#ffe9a8;letter-spacing:5px;
  text-shadow:0 2px 0 #4a2205}
.sub .s{display:block;font-size:20px;font-weight:700;color:#c9ad7c;margin-top:1px}
.sub.dim{filter:grayscale(.6) brightness(.72)}
/* 強化可負擔時的提醒光暈 + 小標籤 */
#upBtn.ready{border-color:#ffd980;box-shadow:0 0 0 1px rgba(255,230,170,.3) inset,
  0 8px 0 #2a1a08,0 12px 24px rgba(0,0,0,.6),0 0 26px rgba(255,190,60,.55);
  animation:upglow 1.6s ease-in-out infinite}
@keyframes upglow{0%,100%{box-shadow:0 0 0 1px rgba(255,230,170,.3) inset,0 8px 0 #2a1a08,0 12px 24px rgba(0,0,0,.6),0 0 18px rgba(255,190,60,.4)}
  50%{box-shadow:0 0 0 1px rgba(255,230,170,.3) inset,0 8px 0 #2a1a08,0 12px 24px rgba(0,0,0,.6),0 0 34px rgba(255,190,60,.85)}}
/* 強化副標把效果數字用金色點出來 */
#upBtn .s b{color:#ffd166;font-weight:900}
.sub .cd{position:absolute;inset:0;background:rgba(0,0,0,.62);
  display:none;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:#ffd166}
.sub.cool .cd{display:flex}

#fightBtn{position:relative;width:100%;height:122px;border:none;border-radius:22px;
  background:linear-gradient(180deg,#ffe9a8 0%,#f5c33c 26%,#d98f1c 62%,#a35c07 100%);
  box-shadow:0 0 0 3px #7a4a0c,0 12px 0 #5b2f05,0 20px 34px rgba(0,0,0,.65),
    0 0 40px rgba(255,170,40,.45);
  font-family:inherit;overflow:hidden;cursor:pointer;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.026)}}
#fightBtn:active{transform:translateY(8px) scale(.99);box-shadow:0 0 0 3px #7a4a0c,0 4px 0 #5b2f05,0 8px 18px rgba(0,0,0,.6)}
#fightBtn .t{display:block;font-size:54px;font-weight:900;color:#4a2205;letter-spacing:12px;
  text-shadow:0 2px 0 rgba(255,255,255,.45)}
#fightBtn .s{display:block;font-size:22px;font-weight:700;color:#6b3a08;margin-top:1px}
#fightBtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%{left:120%}100%{left:120%}}
#fightBtn.dim{filter:grayscale(.55) brightness(.8);animation:none}

/* ---------- 戰鬥特效 ---------- */
#fx{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.slash{position:absolute;left:-30%;width:160%;height:24px;
  background:linear-gradient(90deg,transparent,#fff,#ffd980,transparent);
  filter:blur(1px) drop-shadow(0 0 22px #ffb03c);transform:rotate(-24deg);
  animation:slash .42s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-24deg) translateX(-40%) scaleX(.2)}
  30%{opacity:1}100%{opacity:0;transform:rotate(-24deg) translateX(30%) scaleX(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:.55}100%{opacity:0}}
/* 出戰金光：中心爆光 + 放射光芒 + 金屑 */
#goldFlash{position:absolute;inset:0;opacity:0;background:
  radial-gradient(58% 42% at 50% 46%,rgba(255,247,214,.98) 0%,rgba(255,206,86,.9) 24%,
   rgba(255,150,26,.42) 52%,rgba(255,120,0,0) 76%)}
#goldFlash.go{animation:gflash 1s ease-out}
@keyframes gflash{0%{opacity:0;transform:scale(.55)}
  13%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
#rays{position:absolute;left:50%;top:46%;width:1200px;height:1200px;margin:-600px 0 0 -600px;
  opacity:0;background:repeating-conic-gradient(from 0deg,
    rgba(255,232,160,.92) 0deg 3.5deg,rgba(255,232,160,0) 3.5deg 20deg);
  -webkit-mask-image:radial-gradient(closest-side,rgba(0,0,0,.15) 8%,#000 34%,transparent 72%);
  mask-image:radial-gradient(closest-side,rgba(0,0,0,.15) 8%,#000 34%,transparent 72%)}
#rays.go{animation:raysin 1.05s ease-out}
@keyframes raysin{0%{opacity:0;transform:scale(.35) rotate(0deg)}
  16%{opacity:.95;transform:scale(1) rotate(14deg)}
  100%{opacity:0;transform:scale(1.3) rotate(44deg)}}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8dc,#ffc63c 55%,#e08a10 100%);
  box-shadow:0 0 16px rgba(255,190,60,.95);pointer-events:none}
#shield{position:absolute;left:50%;top:52%;width:520px;height:520px;margin:-260px 0 0 -260px;
  border-radius:50%;border:8px solid rgba(140,220,255,.9);opacity:0;
  box-shadow:0 0 60px rgba(120,200,255,.8) inset,0 0 50px rgba(120,200,255,.7)}
#shield.go{animation:shd .9s ease-out}
@keyframes shd{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.15)}}
#stage.shake{animation:shk .45s linear}
@keyframes shk{0%,100%{margin-left:0;margin-top:0}
  15%{margin-left:-12px;margin-top:7px}35%{margin-left:11px;margin-top:-8px}
  55%{margin-left:-8px;margin-top:5px}75%{margin-left:6px;margin-top:-4px}}
#vsTag{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  font-size:118px;font-weight:900;color:#fff;letter-spacing:8px;opacity:0;
  text-shadow:0 0 30px #ff7a1c,0 6px 0 #8a2b06}
#vsTag.go{animation:vs .8s ease-out}
@keyframes vs{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}

/* ---------- 結果面板 ---------- */
#result{position:absolute;inset:0;z-index:50;display:none;
  background:rgba(6,4,2,.74);backdrop-filter:blur(3px)}
#result.on{display:flex;align-items:center;justify-content:center}
.panel{width:600px;padding:42px 40px 34px;text-align:center;border-radius:26px;
  background:linear-gradient(180deg,rgba(38,24,10,.98),rgba(14,9,4,.98));
  border:3px solid #d8a33d;box-shadow:0 0 0 1px rgba(255,230,160,.3) inset,0 24px 60px rgba(0,0,0,.8);
  animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:scale(1)}}
.panel h2{font-size:80px;font-weight:900;letter-spacing:8px;line-height:1.05}
.win h2{color:#ffe9a8;text-shadow:0 4px 0 #7a3c06,0 0 34px rgba(255,190,60,.75)}
.lose h2{color:#c9c2bb;text-shadow:0 4px 0 #2b2622,0 0 24px rgba(120,120,130,.5)}
.panel .sub2{font-size:27px;font-weight:700;color:#e9d5a8;margin-top:10px;letter-spacing:1px}
.rewards{margin:24px 0 4px;display:flex;flex-direction:column;gap:10px}
.rw{display:flex;align-items:center;justify-content:center;gap:12px;font-size:31px;font-weight:900;
  color:#ffe27a;text-shadow:0 2px 4px #000}
.rw.neg{color:#ff9d8b}
.panel .go{margin-top:24px;font-size:25px;font-weight:700;color:#c9b58e;animation:blink 1.6s ease-in-out infinite}
.lvupTag{display:inline-block;margin-top:20px;padding:11px 26px;border-radius:14px;
  background:linear-gradient(180deg,#8f1d1d,#4a0d0d);border:2px solid #ffd980;
  font-size:30px;font-weight:900;color:#ffe9a8;letter-spacing:2px;
  box-shadow:0 0 26px rgba(255,180,60,.5)}

/* 晉升官階橫幅 */
#lvbanner{position:absolute;left:0;right:0;top:36%;z-index:45;text-align:center;
  pointer-events:none;opacity:0}
#lvbanner.go{animation:lvb 1.9s ease-out}
@keyframes lvb{0%{opacity:0;transform:scale(.6)}
  16%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
#lvbanner .big{font-size:76px;font-weight:900;color:#ffe9a8;letter-spacing:6px;
  text-shadow:0 6px 0 #7a2b06,0 0 46px rgba(255,180,50,.9)}
#lvbanner .small{margin-top:8px;font-size:36px;font-weight:900;color:#8ee08a;
  text-shadow:0 3px 0 #0d3d0d,0 0 22px rgba(90,220,110,.7)}
#burst{position:absolute;left:50%;bottom:560px;width:10px;height:10px;z-index:12;pointer-events:none}
#burst.go::before,#burst.go::after{content:"";position:absolute;left:50%;top:50%;
  width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;
  border:6px solid rgba(255,205,90,.9);animation:ring 1.1s ease-out forwards}
#burst.go::after{animation-delay:.18s;border-color:rgba(255,255,255,.8)}
@keyframes ring{0%{opacity:1;transform:scale(.1)}100%{opacity:0;transform:scale(1.25)}}

/* ---------- 結束卡 ---------- */
#end{position:absolute;inset:0;z-index:60;display:none;
  background:linear-gradient(180deg,rgba(8,5,3,.92),rgba(8,5,3,.98));
  flex-direction:column;align-items:center;justify-content:center;padding:0 50px;cursor:pointer}
#end.on{display:flex;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#end .logo{width:500px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.8));animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#end .line{margin-top:22px;font-size:31px;font-weight:700;color:#f3e5c6;letter-spacing:2px;text-align:center}
#end .hl{margin-top:16px;font-size:54px;font-weight:900;color:#ffe9a8;letter-spacing:4px;
  text-shadow:0 4px 0 #7a3c06,0 0 34px rgba(255,190,60,.6)}
#end .hl2{margin-top:10px;font-size:36px;font-weight:900;color:#fff;letter-spacing:3px;
  text-shadow:0 3px 8px #000}
#end .tag{margin-top:16px;padding:9px 24px;border:2px solid #d8a33d;border-radius:12px;
  font-size:27px;font-weight:700;color:#e9c07a;letter-spacing:2px}
#cta{margin-top:36px;width:100%;height:130px;border:none;border-radius:22px;
  background:linear-gradient(180deg,#ffe9a8 0%,#f5c33c 26%,#d98f1c 62%,#a35c07 100%);
  box-shadow:0 0 0 3px #7a4a0c,0 12px 0 #5b2f05,0 20px 40px rgba(0,0,0,.7),0 0 50px rgba(255,170,40,.5);
  font-family:inherit;font-size:54px;font-weight:900;color:#4a2205;letter-spacing:8px;
  text-shadow:0 2px 0 rgba(255,255,255,.45);cursor:pointer;animation:breathe 1.5s ease-in-out infinite}
#badges{margin-top:28px;display:flex;gap:22px;align-items:center;justify-content:center}
#badges img{height:74px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
#end .fine{margin-top:22px;font-size:19px;color:#9a8a72;letter-spacing:1px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="vig"></div>

  <div id="aura"></div>
  <div id="hero"><img src="{{HERO}}" alt="關羽"></div>
  <div id="burst"></div>

  <div id="tapGuide">
    <div class="rings"><i></i><i></i><i></i>
      <svg class="hand" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M26 6c3 0 5 2.4 5 5.4V30l4.4-3.6c2.4-2 5.8-1.7 7.7.6l.4.5 6.6 8.6c1.6 2 2.4 4.6 2.4 7.2v5.4c0 5-4 9.3-9 9.3H31c-3.4 0-6.6-1.7-8.5-4.6L11 36.6c-1.6-2.5-.9-5.8 1.6-7.4 2.2-1.4 5-1 6.8.8L21 31.6V11.4C21 8.4 23 6 26 6z"
          fill="#fff8e2" stroke="#7a3c06" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="txt">點我催糧！</div>
  </div>

  <div id="combo"><b class="n" id="comboN">0</b><span class="l">COMBO</span></div>

  <div id="hud">
    <div class="row">
      <div class="coinbox">
        <div class="coin">金</div>
        <div>
          <div id="gold">80</div>
          <div id="rate">庫銀 +12 / 秒</div>
        </div>
      </div>
      <div class="lvbox"><b id="lvNum">1</b><i>官階</i></div>
    </div>
    <div id="xpwrap">
      <div class="xplabel">
        <span>戰功 <span id="xpTxt">0 / 2</span> ‧ <span class="pw" id="power">戰力 1,200</span></span>
        <span id="goalTxt">軍資 80 / 30,000</span>
      </div>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
  </div>

  <div id="talk">
    <div class="talkhead">
      <span class="nm">關 羽</span><span class="seal">漢壽亭侯</span>
      <span class="pw">忠勇</span>
    </div>
    <div id="talkTxt">主公，兵馬已備，糧秣亦足，只候一聲令下。</div>
  </div>

  <div id="bottom">
    <div id="tapHint">▲ 連點關羽衝 COMBO，庫銀跳更快</div>
    <div id="subrow">
      <button class="sub" id="defBtn">
        <span class="t">守 城</span><span class="s">徵繳城中稅賦</span>
        <span class="cd" id="defCd">6</span>
      </button>
      <button class="sub" id="upBtn">
        <span class="t">強 化</span><span class="s" id="upSub"><b>收金 +12%</b> ‧ 100 金</span>
      </button>
    </div>
    <button id="fightBtn">
      <span class="t">出 戰</span>
      <span class="s" id="costTxt">點兵 100 金 ‧ 引軍取洛陽</span>
    </button>
  </div>

  <div id="fx">
    <div id="flash"></div>
    <div id="goldFlash"></div>
    <div id="rays"></div>
    <div id="shield"></div>
    <div id="vsTag">殺！</div>
  </div>

  <div id="lvbanner"><div class="big" id="lvbBig">晉升官階 Lv.2</div><div class="small" id="lvbSmall">庫銀增速 ×1.6</div></div>

  <div id="result"></div>

  <div id="end">
    <img class="logo" src="{{LOGO}}" alt="霸王之業">
    <div class="line">「主公，霸業當前，可願與關某同往？」</div>
    <div class="hl">S87 旁親明德</div>
    <div class="hl2">8 / 26 新服開啟</div>
    <div class="tag">7 日名將試用 ‧ 免費領玄關羽</div>
    <button id="cta">立即預約</button>
    <div id="badges">
      <img src="{{IOS}}" alt="App Store">
      <img src="{{GP}}" alt="Google Play">
    </div>
    <div class="fine">三國群英傳－霸王之業 ‧ 遊戲畫面示意</div>
  </div>
</div>

<script>
/* ================= 縮放 ================= */
var STAGE_W=720, STAGE_H=1280, stage=document.getElementById('stage');
function fit(){
  var s=Math.min(innerWidth/STAGE_W, innerHeight/STAGE_H);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize',fit); addEventListener('orientationchange',fit); fit();

/* ================= 廣告 CTA（Meta / Google / IronSource / 通用） ================= */
var STORE_URL='https://play.google.com/store/apps/details?id=com.userjoy.rte&hl=zh_TW';
function clickThrough(){
  try{ if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;} }catch(e){}
  try{ if(window.ExitApi&&ExitApi.exit){ExitApi.exit();return;} }catch(e){}
  try{ if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;} }catch(e){}
  try{ if(window.dapi&&dapi.openStoreUrl){dapi.openStoreUrl();return;} }catch(e){}
  try{ window.open(STORE_URL,'_blank'); }catch(e){}
}

/* ================= 台詞（三國口吻） ================= */
var LINES={
  idle:[
    '主公，兵馬已備，糧秣亦足，只候一聲令下。',
    '某觀敵營旌旗不整，正可趁其懈怠取之。',
    '城中稅賦日增，主公可安坐帳中，從容籌謀。',
    '關某在此，何懼強敵？主公但下令便是。',
    '若主公相許，某願提一旅為先鋒，直取其城。'
  ],
  tap:[
    '主公厚賞，某必不負所託。',
    '金帛充盈，方能養士，此乃霸業之基。',
    '好！倉廩既實，三軍自壯。'
  ],
  goFight:['取吾青龍偃月刀來！','眾將聽令——隨某殺出去！','主公稍待，某去取那賊將首級！'],
  win:['敵將已斬，此城歸主公矣！','旗開得勝，賊眾望風而潰。','某不辱命，洛陽指日可待。'],
  lose:['勝敗乃兵家常事，容某整軍再戰。','敵眾我寡，暫且退兵，另尋良機。','此戰失利，罪在關某，願再領兵。'],
  defend:['城門固若金湯，賊眾自退。','稅賦已入府庫，盡歸主公。','某已巡城一周，四門無虞。'],
  upgrade:['刀鋒既礪，聚糧更速，戰力亦增！','甲堅兵利，此後收金更快。','某又添一分本事，府庫進帳更豐。'],
  poor:['主公，府庫空虛，難以點兵，且待糧至。','無糧不成軍，還請主公稍候。'],
  levelup:['某已受封晉階！自此糧秣倍收，兵馬更盛。','蒙主公拔擢，關某願以此身，報效霸業。'],
  end:['主公，霸業當前，可願與關某同往？']
};
function pick(a){return a[Math.floor(Math.random()*a.length)]}

var elTalk=document.getElementById('talkTxt'), typing=null, idleTimer=null;
function say(txt,holdIdle){
  clearInterval(typing); clearTimeout(idleTimer);
  var i=0; elTalk.textContent='';
  typing=setInterval(function(){
    i++; elTalk.textContent=txt.slice(0,i);
    if(i>=txt.length){
      clearInterval(typing);
      if(!holdIdle) idleTimer=setTimeout(function(){ if(!G.over) say(pick(LINES.idle)) },5200);
    }
  },34);
}

/* ================= 遊戲狀態 ================= */
var G={
  gold:100,         // 起始庫銀，開場幾乎不用等就能出戰
  rate:14,          // 庫銀/秒
  tap:22,           // 點擊獲得
  level:1,
  xp:0,
  need:2,           // 每級所需戰功（勝場）
  battles:0,
  lastLose:false,
  power:1200,
  refine:0,         // 強化次數
  combo:0,          // 連點數
  comboT:0,         // 最後一次點擊時間
  buff:1,           // combo 帶來的產金倍率
  busy:false,
  over:false,
  defCool:0
};
var RATE_MUL=1.7, MAX_LEVEL=5, MAX_BATTLES=30, DEF_CD=6;
var GOLD_GOAL=30000;      // 軍資達標 → 彈出廣告頁
var MAX_TIME=75;          // 保險：最長 75 秒也會進廣告頁（都不操作時）
var COMBO_WINDOW=1600;    // 連點判定時間（毫秒）
var COMBO_CAP=30;         // combo 加成上限（×4.6 產金 / ×6.4 單點）
var WIN_MUL=4.0;          // 勝仗繳獲 = 出兵成本 ×
var DEF_MUL=14;           // 守城稅賦 = 每秒產量 ×
var startT=Date.now();

var $=function(id){return document.getElementById(id)};
var elGold=$('gold'), elRate=$('rate'), elLv=$('lvNum'), elXp=$('xpfill'),
    elXpTxt=$('xpTxt'), elCost=$('costTxt'), elPower=$('power'), elGoal=$('goalTxt'),
    btn=$('fightBtn'), hero=$('hero'), result=$('result'),
    defBtn=$('defBtn'), upBtn=$('upBtn');

function nf(n){return Math.floor(n).toLocaleString('en-US')}
function cost(){return Math.round(100*Math.pow(1.7,G.level-1))}
function refineCost(){return Math.round(100*Math.pow(1.55,G.refine))}

function effRate(){ return G.rate*G.buff }
function renderRate(){
  var hot=G.buff>1.001;
  elRate.textContent='庫銀 +'+nf(effRate())+' / 秒'+(hot?' ×'+G.buff.toFixed(1):'');
  elRate.classList.toggle('hot',hot);
}
function renderGoal(){
  elGoal.textContent='軍資 '+nf(G.gold)+' / '+nf(GOLD_GOAL);
  elXp.style.width=Math.min(100,G.gold/GOLD_GOAL*100)+'%';
}
function render(){
  elGold.textContent=nf(G.gold);
  renderRate(); renderGoal();
  elLv.textContent=G.level;
  elXpTxt.textContent=(G.level>=MAX_LEVEL)?'滿階':(G.xp+' / '+G.need);
  elPower.textContent='戰力 '+nf(G.power);
  elCost.textContent='點兵 '+nf(cost())+' 金 ‧ 引軍取洛陽';
  $('upSub').innerHTML='<b>收金 +12%</b> ‧ '+nf(refineCost())+' 金';
  btn.classList.toggle('dim', G.gold<cost()||G.busy);
  upBtn.classList.toggle('dim', G.gold<refineCost()||G.busy);
  upBtn.classList.toggle('ready', G.gold>=refineCost()&&!G.busy);
}

/* ---- 庫銀自動累積 ---- */
var last=Date.now();
setInterval(function(){
  if(G.over) return;
  var now=Date.now(), dt=(now-last)/1000; last=now;
  G.gold+=effRate()*dt;
  elGold.textContent=nf(G.gold);
  renderGoal();
  btn.classList.toggle('dim', G.gold<cost()||G.busy);
  upBtn.classList.toggle('dim', G.gold<refineCost()||G.busy);
  upBtn.classList.toggle('ready', G.gold>=refineCost()&&!G.busy);
  if(G.gold>=GOLD_GOAL) endCard();          // 軍資達標 → 廣告頁
  else if((Date.now()-startT)/1000>=MAX_TIME) endCard();   // 保險：時間到也進廣告頁
},100);

/* ---- combo 衰減：超過判定時間沒點就斷 ---- */
setInterval(function(){
  if(G.over||G.busy||G.combo===0) return;      // 戰鬥中凍結 combo，不因動畫斷連
  if(Date.now()-G.comboT>COMBO_WINDOW){
    G.combo=0; G.buff=1;
    $('combo').classList.remove('on');
    renderRate();
  }
},120);

/* ---- 守城冷卻 ---- */
setInterval(function(){
  if(G.defCool>0){
    G.defCool--;
    $('defCd').textContent=G.defCool;
    if(G.defCool<=0) defBtn.classList.remove('cool');
  }
},1000);

/* ---- 飄字 ---- */
function floatText(txt,x,y,neg,small){
  var d=document.createElement('div');
  d.className='float'+(neg?' red':'')+(small?' small':''); d.textContent=txt;
  d.style.left=x+'px'; d.style.top=y+'px';
  stage.appendChild(d);
  setTimeout(function(){d.remove()},1000);
}
function centerFloat(txt,neg){ floatText(txt,360,540,neg,txt.length>7) }

/* ---- 點擊關羽催糧 ---- */
hero.addEventListener('pointerdown',function(e){
  if(G.over) return;
  $('tapGuide').classList.add('hide');          // 點過就收掉引導

  // combo：時間內連點才累積
  var now=Date.now();
  G.combo = (now-G.comboT < COMBO_WINDOW) ? G.combo+1 : 1;
  G.comboT = now;
  var c=Math.min(G.combo,COMBO_CAP);
  G.buff = 1 + c*0.12;                          // 產金速度最高 ×4.6
  var gain = Math.round(G.tap*(1 + c*0.18));    // 單次點擊最高 ×6.4

  G.gold+=gain;
  hero.classList.remove('hit'); void hero.offsetWidth; hero.classList.add('hit');

  var cb=$('combo');
  if(G.combo>=2){
    $('comboN').textContent=G.combo;
    cb.classList.add('on');
    cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
  }

  var r=stage.getBoundingClientRect(), sc=r.width/STAGE_W;
  floatText('+'+nf(gain),(e.clientX-r.left)/sc,(e.clientY-r.top)/sc);
  if(Math.random()<.22) say(pick(LINES.tap));
  render();
});

/* ================= 守城：徵稅 + 加成 ================= */
defBtn.addEventListener('click',function(){
  if(G.busy||G.over||G.defCool>0) return;
  var g=Math.round(G.rate*DEF_MUL);
  G.gold+=g; G.power+=60;
  G.defCool=DEF_CD; defBtn.classList.add('cool'); $('defCd').textContent=DEF_CD;
  $('shield').classList.remove('go'); void $('shield').offsetWidth; $('shield').classList.add('go');
  centerFloat('稅賦 +'+nf(g));
  say(pick(LINES.defend));
  render();
});

/* ================= 強化：戰力 + 產金速度 ================= */
upBtn.addEventListener('click',function(){
  if(G.busy||G.over) return;
  var c=refineCost();
  if(G.gold<c){ say(pick(LINES.poor)); centerFloat('庫銀不足！',true); return }
  G.gold-=c; G.refine++;
  G.power=Math.round(G.power*1.14);
  G.rate=Math.round(G.rate*1.12+1);
  G.tap=Math.round(G.tap*1.12+1);
  hero.style.transition='filter .3s'; hero.style.filter='brightness(1.35) drop-shadow(0 0 30px #ffcf5a)';
  setTimeout(function(){hero.style.filter=''},380);
  centerFloat('收金 +12% ‧ 每秒 '+nf(G.rate));
  say(pick(LINES.upgrade));
  render();
});

/* ================= 出戰 ================= */
btn.addEventListener('click',function(){
  if(G.busy||G.over) return;
  if(G.gold<cost()){ say(pick(LINES.poor)); centerFloat('庫銀不足！',true); return }
  G.busy=true; G.gold-=cost(); G.battles++;
  say(pick(LINES.goFight),true);
  render();

  goldBurst();
  $('vsTag').classList.remove('go'); void $('vsTag').offsetWidth; $('vsTag').classList.add('go');
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  for(var i=0;i<3;i++) addSlash(i*130);

  setTimeout(judge,900);
});
/* 出戰金光：中心爆光 + 放射光芒 + 金屑四散 */
function goldBurst(){
  ['flash','goldFlash','rays'].forEach(function(id){
    var el=$(id); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  });
  var cx=360, cy=560;
  if(!document.body.animate && !Element.prototype.animate) return;  // 舊 WebView：只留爆光與光芒
  for(var i=0;i<18;i++){
    var sp=document.createElement('div'); sp.className='spark';
    var ang=(Math.PI*2/18)*i + Math.random()*0.3,
        dist=200+Math.random()*260,
        dur=520+Math.random()*380,
        sz=9+Math.random()*14;
    sp.style.width=sp.style.height=sz+'px';
    sp.style.left=cx+'px'; sp.style.top=cy+'px';
    $('fx').appendChild(sp);
    try{ sp.animate([
      {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:'translate(calc(-50% + '+Math.cos(ang)*dist+'px),calc(-50% + '+Math.sin(ang)*dist+'px)) scale(1.15)',opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.2,.7,.3,1)'}); }catch(e){}
    setTimeout(function(el){return function(){el.remove()}}(sp),dur+60);
  }
}

function addSlash(delay){
  setTimeout(function(){
    var s=document.createElement('div'); s.className='slash';
    s.style.top=(36+Math.random()*26)+'%';
    $('fx').appendChild(s);
    setTimeout(function(){s.remove()},480);
  },delay);
}

function judge(){
  // 前兩場必勝；之後留敗場製造張力，但不連敗，節奏才不會卡
  var win = (G.battles<=2) ? true : (G.lastLose ? true : Math.random()>0.28);
  G.lastLose = !win;
  if(win){
    var g=Math.round(cost()*WIN_MUL), p=Math.round(200*G.level);
    G.gold+=g; G.power+=p; G.xp++;
    showResult(true,g,p);
  }else{
    var g2=Math.round(cost()*.35);
    G.gold+=g2; G.power+=50;
    showResult(false,g2,50);
  }
  render();
}

function showResult(win,g,p){
  var lvup = win && G.xp>=G.need && G.level<MAX_LEVEL;
  say(pick(win?LINES.win:LINES.lose),true);
  result.innerHTML=
    '<div class="panel '+(win?'win':'lose')+'">'+
      '<h2>'+(win?'大 勝':'敗 退')+'</h2>'+
      '<div class="sub2">'+(win?'關羽單騎斬將，此城已入主公之手':'敵陣堅厚，我軍暫退三十里')+'</div>'+
      '<div class="rewards">'+
        '<div class="rw">繳獲庫銀 +'+nf(g)+'</div>'+
        '<div class="rw'+(win?'':' neg')+'">戰力 +'+nf(p)+(win?' ‧ 戰功 +1':' ‧ 戰功 +0')+'</div>'+
      '</div>'+
      (lvup?'<div class="lvupTag">戰功已滿 ‧ 即將晉爵！</div>':'')+
      '<div class="go">點擊任意處繼續</div>'+
    '</div>';
  result.classList.add('on');
  var done=false;
  result.onclick=function(){
    if(done) return; done=true;
    result.classList.remove('on'); result.onclick=null;
    G.busy=false;
    if(G.combo>0) G.comboT=Date.now();          // 接回 combo 計時
    if(lvup){ levelUp(); }
    else if(G.battles>=MAX_BATTLES){ render(); setTimeout(endCard,400); }
    else { render(); if(!G.over) say(pick(LINES.idle)); }
  };
  setTimeout(function(){ if(!done&&result.classList.contains('on')) result.onclick(); },2300);
}

/* ================= 晉升官階（升級） ================= */
function levelUp(){
  G.level++; G.xp=0;
  G.rate=Math.round(G.rate*RATE_MUL);
  G.tap=Math.round(G.tap*RATE_MUL);
  G.power=Math.round(G.power*1.4);

  $('lvbBig').textContent='晉升官階 Lv.'+G.level;
  $('lvbSmall').textContent='庫銀增速 ×1.6 → +'+nf(G.rate)+' / 秒';
  var b=$('lvbanner'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  var bu=$('burst'); bu.classList.remove('go'); void bu.offsetWidth; bu.classList.add('go');
  hero.style.transition='filter .4s'; hero.style.filter='brightness(1.55) drop-shadow(0 0 44px #ffcf5a)';
  setTimeout(function(){hero.style.filter=''},760);
  say(pick(LINES.levelup),true);

  render();
  setTimeout(function(){ if(!G.over) say(pick(LINES.idle)) },2600);
}

/* ================= 結束卡 ================= */
function endCard(){
  if(G.over) return;
  G.over=true;
  clearInterval(typing); clearTimeout(idleTimer);
  $('combo').classList.remove('on');
  $('end').classList.add('on');
}
$('end').addEventListener('click',clickThrough);
$('cta').addEventListener('click',function(e){e.stopPropagation();clickThrough()});

render();
say(LINES.idle[0]);
</script>
</body>
</html>
