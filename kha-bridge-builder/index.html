<style>
html,body{margin:0;height:100%;background:#0e1c24;overflow:hidden;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px}
canvas{position:absolute;left:0;top:0;width:1600px;height:900px;cursor:crosshair}
.panel{position:absolute;background:rgba(40,56,70,.88);color:#fff;border-radius:12px;font-weight:700}
#budget{left:18px;top:16px;width:306px;height:70px}
#budget .coin{position:absolute;left:12px;top:11px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#e2a21c 70%);border:3px solid #a86c00;box-sizing:border-box}
#budget .coin:after{content:"";position:absolute;left:13px;top:13px;width:16px;height:16px;border:3px solid #a86c00;box-sizing:border-box;border-radius:3px}
#budget .txt{position:absolute;left:78px;top:6px;font-size:30px;letter-spacing:1px}
#budget .bar{position:absolute;left:78px;top:46px;width:214px;height:12px;border-radius:6px;background:#7a6a4a;overflow:hidden}
#budget .bar i{display:block;height:100%;width:0;background:#8fd15a;border-radius:6px;transition:width .15s}
#budget.over .txt{color:#ff8d7a}#budget.over .bar i{background:#e8553d}
#level{left:660px;top:16px;width:280px;height:58px;line-height:58px;text-align:center;font-size:30px;display:flex;justify-content:space-between;align-items:center}
#level span{flex:1;white-space:nowrap}#level b{width:56px;cursor:pointer;font-size:26px;color:#cfe0ea}#level b.off{opacity:.25;cursor:default}#level i{font-style:normal;color:#ffd84a;font-size:26px;margin-left:6px}
.mat.ban{opacity:.3;cursor:not-allowed}
#msg button+button{margin-left:14px;background:#5d7f95}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:84px;padding:4px 16px;border-radius:16px;background:rgba(30,45,60,.55);white-space:nowrap;color:#fff;font-size:20px;pointer-events:none}
#hint:empty{display:none}
.sq{position:absolute;bottom:36px;width:118px;height:132px;border-radius:18px;border:5px solid #e9e4d2;background:#8d8a7c;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.sq:active{transform:translateY(3px)}
.sq svg{width:70px;height:70px}
#undo{left:28px}#trash{left:162px}
#trash.on{background:#c9553d;border-color:#ffd9c9}

.mat{width:186px;height:132px;border-radius:22px;background:#5d5348;cursor:pointer;position:relative;box-sizing:border-box;border:4px solid transparent}
.mat img{position:absolute;left:56px;top:27px;width:66px;height:66px;pointer-events:none}
.mat .p{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:26px;font-weight:700}
.mat .p b{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#e2a21c 70%);border:2px solid #a86c00;box-sizing:border-box;vertical-align:-3px;margin-left:6px}
.mat .n{position:absolute;left:0;right:0;text-align:center;top:5px;color:#d8cfbf;font-size:17px;font-weight:700}
.mat.sel{background:#ecd392;border-color:#fff6d6}
.mat.sel .p{color:#4a3b2e}.mat.sel .n{color:#6b5a3c}
#play{position:absolute;right:30px;bottom:36px;width:196px;height:148px;border-radius:22px;border:6px solid #e6f5d6;background:#6dbb45;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.3)}

// ---------- 狀態 ----------
let nodes=[],beams=[],history=[],mat='wood',erase=false,from=null,dragging=false,cursor={x:0,y:0},sim=null,box=null;
function anchors(){const L=LEVELS[LV],a=[[LX,GY],[RX,GY]];if(L.low)a.push([LX,GY+120],[RX,GY+120]);return a.concat(L.piers||[],L.posts||[]);}
function reset(){nodes=anchors().map(p=>({x:p[0],y:p[1],fixed:true}));beams=[];}
function setLevel(i){
  if(i<0||i>=LEVELS.length)return;
  if(sim)stopSim();designs[LV]=ser();LV=i;budget=LEVELS[i].budget;history=[];from=null;erase=false;
  if(designs[i])load(designs[i]);else reset();
  if((LEVELS[i].ban||[]).includes(mat))mat=Object.keys(MATS).find(m=>!(LEVELS[i].ban||[]).includes(m));
  ui();
}
const ser=()=>JSON.stringify({n:nodes.map(n=>[n.x,n.y,n.fixed?1:0]),b:beams.map(b=>[nodes.indexOf(b.a),nodes.indexOf(b.b),b.mat])});
function load(s){const d=typeof s==='string'?JSON.parse(s):s;nodes=d.n.map(n=>({x:n[0],y:n[1],fixed:!!n[2]}));beams=d.b.map(b=>({a:nodes[b[0]],b:nodes[b[1]],mat:b[2]}));from=null;ui();}
const save=()=>{history.push(ser());if(history.length>200)history.shift();};
const len=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const beamCost=b=>Math.round(MATS[b.mat].price*len(b.a,b.b)/UNIT/5)*5;
const cost=()=>beams.reduce((s,b)=>s+beamCost(b),0);
const nodeAt=(p,r=24)=>{let best=null,bd=r;for(const n of nodes){const d=len(n,p);if(d<bd){bd=d;best=n;}}return best;};
const valid=p=>p.x>=LX&&p.x<=RX&&p.y>=200&&p.y<=680;
function target(f,p){
  let dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy)||1;
  for(let L=Math.min(d,MAXLEN+20);L>=G;L-=8){
    const t={x:Math.round((f.x+dx/d*L)/G)*G,y:Math.round((f.y+dy/d*L)/G)*G};
    const n=nodeAt(p,26);if(n&&n!==f&&len(n,f)<=MAXLEN)return{x:n.x,y:n.y};
    if(len(t,f)<=MAXLEN&&len(t,f)>1&&valid(t))return t;
  }
  return null;
}
function create(f,t){
  if(!t)return;
  let n=nodes.find(n=>len(n,t)<1);
  if(n===f)return;
  if(n&&beams.some(b=>(b.a===f&&b.b===n)||(b.a===n&&b.b===f)))return;
  save();
  if(!n){n={x:t.x,y:t.y,fixed:false};nodes.push(n);}
  beams.push({a:f,b:n,mat});ui();
}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t);}
function removeAt(p){
  let best=null,bd=16;for(const b of beams){const d=segDist(p,b.a,b.b);if(d<bd){bd=d;best=b;}}
  if(!best)return;save();beams.splice(beams.indexOf(best),1);
  nodes=nodes.filter(n=>n.fixed||beams.some(b=>b.a===n||b.b===n));ui();
}
function cross(p,q,r,t){const d=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);return d(p,q,r)*d(p,q,t)<0&&d(r,t,p)*d(r,t,q)<0;}
function removeBox(bx){
  const x0=Math.min(bx.x0,bx.x1),x1=Math.max(bx.x0,bx.x1),y0=Math.min(bx.y0,bx.y1),y1=Math.max(bx.y0,bx.y1);
  const inside=p=>p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1,cs=[{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}];
  const hit=b=>inside(b.a)||inside(b.b)||cs.some((c1,i)=>cross(b.a,b.b,c1,cs[(i+1)%4]));
  if(!beams.some(hit))return;
  save();beams=beams.filter(b=>!hit(b));
  nodes=nodes.filter(n=>n.fixed||beams.some(b=>b.a===n||b.b===n));ui();
}

function startSim(){
  from=null;dragging=false;
  const sn=nodes.map(n=>({x:n.x,y:n.y,vx:0,vy:0,fx:0,fy:0,m:0.1,fixed:n.fixed}));
  const sb=beams.map(b=>{const a=sn[nodes.indexOf(b.a)],d=sn[nodes.indexOf(b.b)],M=MATS[b.mat],L=len(a,d);a.m+=M.w*L/2;d.m+=M.w*L/2;return{a,b:d,L0:L,M,mat:b.mat,stress:0,broken:false};});
  const wh=[150,150+WL].map(x=>({x,y:GY-R,vx:0,vy:0,fx:0,fy:0,m:LEVELS[LV].cart||4,rot:0}));
  sim={t:0,nodes:sn,beams:sb,wheels:wh,state:'run',broke:0,acc:0};
  $('#msg').style.display='none';ui();
}
function stopSim(){sim=null;$('#msg').style.display='none';ui();}
const GROUND=[[-200,LX],[RX,W+200]];
function contact(s,w,ax,ay,bx,by,na,nb){
  if(ax>bx){let t=ax;ax=bx;bx=t;t=ay;ay=by;by=t;t=na;na=nb;nb=t;}
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(dx<1e-3||l2<1)return;
  const l=Math.sqrt(l2);let t=((w.x-ax)*dx+(w.y-ay)*dy)/l2,nx,ny,pen;
  if(t>=0&&t<=1){nx=dy/l;ny=-dx/l;const d=(w.x-ax)*nx+(w.y-ay)*ny;if(d>=R||d<-R)return;pen=R-d;}
  else{t=t<0?0:1;const ex=w.x-(ax+dx*t),ey=w.y-(ay+dy*t),d=Math.hypot(ex,ey);if(d>=R||d<1e-6||ey>0)return;nx=ex/d;ny=ey/d;pen=R-d;}
  let bvx=0,bvy=0;if(na){bvx=na.vx*(1-t)+nb.vx*t;bvy=na.vy*(1-t)+nb.vy*t;}
  const rvx=w.vx-bvx,rvy=w.vy-bvy,vn=rvx*nx+rvy*ny;
  let F=20000*pen-120*vn;if(F<=0)return;
  const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;
  let Ft=0;
  if(s.state!=='fail'){const goal=(s.state==='run'&&s.t>1.2)?SPEED:0;Ft=(goal-vt)*60;const lim=Math.min(2600,F*1.2);Ft=Math.max(-lim,Math.min(lim,Ft));}
  const fx=nx*F+tx*Ft,fy=ny*F+ty*Ft;
  w.fx+=fx;w.fy+=fy;
  if(na){if(!na.fixed){na.fx-=fx*(1-t);na.fy-=fy*(1-t);}if(!nb.fixed){nb.fx-=fx*t;nb.fy-=fy*t;}}
}
function step(s){
  const g=GRAV*Math.min(1,s.t/0.8);
  for(const n of s.nodes){n.fx=0;n.fy=n.m*g;}
  for(const w of s.wheels){w.fx=0;w.fy=w.m*g;}
  for(const b of s.beams){
    if(b.broken)continue;
    const dx=b.b.x-b.a.x,dy=b.b.y-b.a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    let Fe=b.M.ea*(L-b.L0)/b.L0;
    if(b.M.rope&&Fe<0){b.stress=0;continue;}
    b.stress=Math.abs(Fe)/b.M.str;
    if(b.stress>1){b.broken=true;s.broke++;continue;}
    const F=Fe+40*((b.b.vx-b.a.vx)*ux+(b.b.vy-b.a.vy)*uy);
    b.a.fx+=F*ux;b.a.fy+=F*uy;b.b.fx-=F*ux;b.b.fy-=F*uy;
  }
  {const a=s.wheels[0],b=s.wheels[1],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
   const F=30000*(L-WL)+200*((b.vx-a.vx)*ux+(b.vy-a.vy)*uy);a.fx+=F*ux;a.fy+=F*uy;b.fx-=F*ux;b.fy-=F*uy;}
  for(const w of s.wheels){
    for(const gr of GROUND)contact(s,w,gr[0],GY,gr[1],GY,null,null);
    for(const b of s.beams)if(!b.broken&&b.M.road)contact(s,w,b.a.x,b.a.y,b.b.x,b.b.y,b.a,b.b);
  }
  for(const n of s.nodes){if(n.fixed)continue;n.vx=(n.vx+n.fx/n.m*DT)*0.9995;n.vy=(n.vy+n.fy/n.m*DT)*0.9995;n.x+=n.vx*DT;n.y+=n.vy*DT;}
  for(const w of s.wheels){w.vx=(w.vx+w.fx/w.m*DT)*0.9998;w.vy=(w.vy+w.fy/w.m*DT)*0.9998;w.x+=w.vx*DT;w.y+=w.vy*DT;w.rot+=w.vx*DT/R;}
  s.t+=DT;
  if(s.state==='run'){
    if(s.wheels[0].x>1285)finish(s,'win');
    else if(s.wheels.some(w=>w.y>WATER+10))finish(s,'fail');
    else if(s.t>45)finish(s,'fail',true);
  }
}
function finish(s,r,stuck){
  s.state=r;if(s!==sim)return;
  if(r==='win'){const k=LEVELS[LV].name,cc=cost();if(!best[k]||cc<best[k]){best[k]=cc;try{localStorage.setItem('kha_bridge_best',JSON.stringify(best));}catch(e){}}ui();}
  const m=$('#msg');m.className='panel '+r;m.style.display='block';
  m.querySelector('h2').textContent=r==='win'?'糧車過橋成功！':(stuck?'糧車卡住了…':'橋垮了！');
  m.querySelector('p').textContent=r==='win'?`花費 ${cost().toLocaleString()} / ${budget.toLocaleString()}　斷裂 ${s.broke} 根`+(best[LEVELS[LV].name]?`　最佳 ${best[LEVELS[LV].name].toLocaleString()}`:''):(stuck?'橋面沒有接通，回去補一補吧。':'糧車落水，丞相搖了搖羽扇。');
  const last=LV===LEVELS.length-1;$('#msgA').textContent=r==='win'?(last?'全部過關！':'下一關'):'回去修改';$('#msgA').dataset.next=(r==='win'&&!last)?1:0;$('#msgB').textContent='再蓋一座更省的';$('#msgB').style.display=r==='win'?'':'none';
}

// ---------- 場景與人物（覺醒 Q 版素材） ----------
function line(g,x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function sprite(k,x,h,bob){const im=IMG[k];if(!im.complete||!im.naturalWidth)return;const w=h*im.naturalWidth/im.naturalHeight;
  c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(x,GY+2,w*.42,7,0,0,7);c.fill();
  c.drawImage(im,x-w/2,GY+4-h+(bob||0),w,h);}
// ---------- 繪圖 ----------
function drawBeam(a,b,m,stress,alpha){
  const M=MATS[m];c.globalAlpha=alpha||1;c.lineCap='round';
  c.strokeStyle=M.edge;c.lineWidth=M.lw+4;line(c,a.x,a.y,b.x,b.y);
  c.strokeStyle=M.color;c.lineWidth=M.lw;line(c,a.x,a.y,b.x,b.y);
  const L=len(a,b),ux=(b.x-a.x)/(L||1),uy=(b.y-a.y)/(L||1);
  if(m==='bamboo'||m==='stone'){c.strokeStyle=M.edge;c.lineWidth=2.5;const sp=m==='stone'?24:32;for(let d=sp;d<L-6;d+=sp){const x=a.x+ux*d,y=a.y+uy*d,h=M.lw/2;line(c,x-uy*h,y+ux*h,x+uy*h,y-ux*h);}}
  if(m==='wood'){c.strokeStyle='rgba(60,30,10,.35)';c.lineWidth=2;line(c,a.x+ux*8-uy*2,a.y+uy*8+ux*2,b.x-ux*8-uy*2,b.y-uy*8+ux*2);}
  if(stress>.3){c.strokeStyle=`rgba(235,40,20,${Math.min(1,(stress-.3)/.7)*.85})`;c.lineWidth=M.lw;line(c,a.x,a.y,b.x,b.y);}
  c.globalAlpha=1;
}
function drawNode(n){
  if(n.fixed){c.fillStyle='#7d1f14';c.fillRect(n.x-14,n.y-14,28,28);c.fillStyle='#e0402c';c.fillRect(n.x-11,n.y-11,22,22);}
  else{c.fillStyle='#c9a45c';c.strokeStyle='#5a4020';c.lineWidth=3;c.beginPath();c.arc(n.x,n.y,9,0,7);c.fill();c.stroke();}
}
function drawCart(a,b){
  const im=IMG.cart;if(!im.complete||!im.naturalWidth)return;
  const w=WL/0.493,h=w*im.naturalHeight/im.naturalWidth;
  c.save();c.translate(a.x,a.y);c.rotate(Math.atan2(b.y-a.y,b.x-a.x));
  c.drawImage(im,-0.224*w,-0.72*h+Math.sin((a.rot||0)*2)*1.2,w,h);
  c.restore();
}
function draw(){
  if(IMG.bg.complete&&IMG.bg.naturalWidth)c.drawImage(IMG.bg,0,0,W,H);else{c.fillStyle='#9cc9e0';c.fillRect(0,0,W,H);}
  const tt=performance.now()/1000,st=sim?sim.state:'';
  const Lv=LEVELS[LV];
  for(const p of Lv.piers||[]){const x=p[0],y=p[1];c.fillStyle='#8f9296';c.fillRect(x-26,y+6,52,H-y);c.fillStyle='#a9acae';c.fillRect(x-26,y+6,18,H-y);
    c.strokeStyle='rgba(50,55,60,.5)';c.lineWidth=2;for(let yy=y+34;yy<H;yy+=28){line(c,x-26,yy,x+26,yy);const o=((yy-y)/28|0)%2?-9:9;line(c,x+o,yy-28,x+o,yy);}
    c.fillStyle='#b9bcbd';c.fillRect(x-32,y-4,64,14);c.strokeStyle='#5d6166';c.strokeRect(x-32,y-4,64,14);
    c.fillStyle='rgba(38,112,170,.45)';c.fillRect(x-30,Math.max(y+10,WATER-70),60,H);}
  for(const p of Lv.posts||[]){const x=p[0]+(p[0]<800?-10:10),y=p[1];c.strokeStyle='#4a2c14';c.lineWidth=20;c.lineCap='butt';line(c,x,GY+6,x,y-6);c.strokeStyle='#8a5530';c.lineWidth=14;line(c,x,GY+6,x,y-6);
    c.strokeStyle='#4a2c14';c.lineWidth=7;line(c,x+(p[0]<800?-46:46),GY+2,x,GY-70);c.fillStyle='#4a2c14';c.fillRect(x-14,y-14,28,10);}
  sprite('zhaoyun',52,140,st==='win'?-Math.abs(Math.sin(tt*6))*10:0);
  sprite('simayi',1545,136,0);
  sprite('zhuge',402,140,st==='win'?-Math.abs(Math.sin(tt*6+1))*10:(st==='fail'?Math.sin(tt*30)*1.5:0));
  if(!sim){
    c.fillStyle='rgba(255,255,255,.7)';
    for(let x=LX;x<=RX;x+=G)for(let y=200;y<=680;y+=G){c.beginPath();c.arc(x,y,2.2,0,7);c.fill();}
    for(const b of beams)drawBeam(b.a,b.b,b.mat,0);
    if(from){const t=target(from,cursor);if(t){drawBeam(from,t,mat,0,.55);c.fillStyle='#ffd83a';c.strokeStyle='#8a6a00';c.lineWidth=3;c.beginPath();c.arc(t.x,t.y,11,0,7);c.fill();c.stroke();}
      c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(from.x,from.y,20,0,7);c.stroke();}
    for(const n of nodes)drawNode(n);
    if(box){c.fillStyle='rgba(230,60,40,.18)';c.strokeStyle='#e8402c';c.lineWidth=3;c.setLineDash([10,7]);c.fillRect(box.x0,box.y0,box.x1-box.x0,box.y1-box.y0);c.strokeRect(box.x0,box.y0,box.x1-box.x0,box.y1-box.y0);c.setLineDash([]);}
    drawCart({x:150,y:GY-R,rot:0},{x:150+WL,y:GY-R});
  }else{
    for(const b of sim.beams)if(!b.broken)drawBeam(b.a,b.b,b.mat,b.stress);
    for(const n of sim.nodes)drawNode(n);
    drawCart(sim.wheels[0],sim.wheels[1]);
    c.fillStyle='rgba(38,112,170,.55)';c.fillRect(498,WATER,680,H-WATER);
  }
}
function ui(){
  const u=cost(),b=$('#budget');
  b.querySelector('.txt').textContent=`${u.toLocaleString()} / ${budget.toLocaleString()}`;
  b.querySelector('i').style.width=Math.min(100,u/budget*100)+'%';b.classList.toggle('over',u>budget);
  const L=LEVELS[LV];$('#lvName').innerHTML=L.name+(best[L.name]?'<i>★</i>':'');$('#lvPrev').classList.toggle('off',LV===0);$('#lvNext').classList.toggle('off',LV===LEVELS.length-1);
  document.querySelectorAll('.mat').forEach(e=>e.classList.toggle('ban',(L.ban||[]).includes(e.dataset.m)));
  document.querySelectorAll('.mat').forEach(e=>e.classList.toggle('sel',e.dataset.m===mat));
  $('#trash').classList.toggle('on',erase);
  $('#play').classList.toggle('stop',!!sim);
  $('#playIcon').setAttribute('d',sim?'M22 22H68V68H22Z':'M24 12 L76 45 L24 78Z');
  $('#hint').textContent=sim?'':(u>budget?'超出預算了，刪掉一些再發車':(erase?'刪除模式：點橋樑刪除，或拖曳框選一次刪多根；再按一次垃圾桶離開':`【${L.title}】${L.tip}`));
  for(const s of['#undo','#trash','#mats'])$(s).style.opacity=sim?.45:1;
}

// ---------- 操作 ----------
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(sim)return;const p=pos(e);cursor=p;
  if(e.button===2){if(from)from=null;else removeAt(p);return;}
  if(erase){box={x0:p.x,y0:p.y,x1:p.x,y1:p.y};cv.setPointerCapture(e.pointerId);return;}
  if(from&&!dragging){create(from,target(from,p));from=null;return;}
  const n=nodeAt(p);if(n){from=n;dragging=true;cv.setPointerCapture(e.pointerId);}
});
cv.addEventListener('pointermove',e=>{cursor=pos(e);if(box){box.x1=cursor.x;box.y1=cursor.y;}});
cv.addEventListener('pointercancel',()=>{box=null;dragging=false;});
cv.addEventListener('pointerup',e=>{
  if(box){const bx=box;box=null;if(Math.hypot(bx.x1-bx.x0,bx.y1-bx.y0)<14)removeAt({x:bx.x0,y:bx.y0});else removeBox(bx);return;}
  if(!dragging||!from)return;dragging=false;cursor=pos(e);
  if(len(cursor,from)>20){create(from,target(from,cursor));from=null;}
});
$('#mats').addEventListener('click',e=>{const m=e.target.closest('.mat');if(m&&!sim&&!m.classList.contains('ban')){mat=m.dataset.m;erase=false;ui();}});
const undo=()=>{if(sim||!history.length)return;load(history.pop());};
$('#undo').onclick=undo;
$('#trash').onclick=()=>{if(sim)return;erase=!erase;from=null;box=null;ui();};
const toggle=()=>{if(sim)stopSim();else if(cost()<=budget)startSim();};
$('#play').onclick=toggle;
$('#msgA').onclick=()=>{if($('#msgA').dataset.next==='1')setLevel(LV+1);else stopSim();};$('#msgB').onclick=stopSim;
$('#lvPrev').onclick=()=>setLevel(LV-1);$('#lvNext').onclick=()=>setLevel(LV+1);
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='Escape'){from=null;erase=false;ui();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z')undo();
  else if('1234'.includes(e.key)&&!sim&&!(LEVELS[LV].ban||[]).includes(Object.keys(MATS)[+e.key-1])){mat=Object.keys(MATS)[+e.key-1];erase=false;ui();}
});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(sim){sim.acc+=dt;while(sim.acc>=1/60){for(let i=0;i<SUB;i++)step(sim);sim.acc-=1/60;}}
  draw();requestAnimationFrame(frame);
}
reset();fit();ui();requestAnimationFrame(frame);

// 測試用
window.game={LEVELS,setLevel,get lv(){return LV;},load,ser,cost,start:startSim,stop:stopSim,get sim(){return sim;},
  run(sec){if(!sim)startSim();for(let i=0;i<sec*60*SUB&&sim.state==='run';i++)step(sim);return{state:sim.state,t:+sim.t.toFixed(2),broke:sim.broke,x:Math.round(sim.wheels[0].x),max:+Math.max(...sim.beams.map(b=>b.broken?0:b.stress)).toFixed(2)};}};
})();
</script>
