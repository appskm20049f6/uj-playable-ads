<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>三國群英傳－霸王之業｜老戰友回城</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07060a;
  font-family:"Noto Serif TC","Microsoft JhengHei","PingFang TC",serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* 素材只內嵌一份，其餘用 var() 引用，避免同一張圖被 base64 重複塞進檔案 */
:root{--cityFull:url("{{CITY_FULL}}");--cityRuin:url("{{CITY_RUIN}}")}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;
  transform-origin:50% 50%;overflow:hidden;background:#07060a}

/* ---------- 城池：完好底 + 廢墟蒙層 ---------- */
#cityFull{position:absolute;inset:0;background:var(--cityFull) center/cover no-repeat}
#cityRuin{position:absolute;inset:0;background:var(--cityRuin) center/cover no-repeat;
  opacity:1;transition:opacity 1.1s ease}
/* 修復後恢復顏色的區塊：用完好圖對位 + 圓形遮罩 */
.patch{position:absolute;width:360px;height:360px;opacity:0;
  background-image:var(--cityFull);background-size:720px 1280px;background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(closest-side,#000 52%,rgba(0,0,0,.35) 78%,transparent 100%);
  mask-image:radial-gradient(closest-side,#000 52%,rgba(0,0,0,.35) 78%,transparent 100%);
  transition:opacity .85s ease}
.patch.on{opacity:1}
#dust{position:absolute;inset:0;pointer-events:none;opacity:1;transition:opacity 1.2s ease}
#dust i{position:absolute;width:6px;height:6px;border-radius:50%;
  background:rgba(206,198,186,.5);animation:drift 9s linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}
  15%{opacity:.8}100%{transform:translate(-40px,-320px);opacity:0}}
#vig{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(120% 66% at 50% 44%,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 100%),
  linear-gradient(180deg,rgba(6,5,8,.92) 0%,rgba(6,5,8,.1) 20%,rgba(6,5,8,.22) 56%,rgba(6,5,8,.96) 100%)}

/* ---------- 頂部 HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;padding:20px 26px 0;z-index:20;opacity:0;
  transition:opacity .5s ease}
#hud.on{opacity:1}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:24px;font-weight:900;color:#f3e5c6;text-shadow:0 2px 5px rgba(0,0,0,.9);margin-bottom:7px}
.hrow .r{color:#ffe9a8}
#pbar{height:22px;border-radius:12px;background:rgba(0,0,0,.72);border:2px solid #a37b2c;
  overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.6)}
#pfill{height:100%;width:0%;border-radius:10px;transition:width .5s ease;
  background:linear-gradient(90deg,#ffb63c,#ffe9a8 60%,#fff8dd);
  box-shadow:0 0 18px rgba(255,190,70,.9)}
#logoTop{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:184px;z-index:20;
  opacity:.9;filter:drop-shadow(0 4px 12px rgba(0,0,0,.9))}

/* ---------- 開場鉤子 ---------- */
#hook{position:absolute;inset:0;z-index:38;cursor:pointer}
#hook.off{display:none}
#hook.fade{animation:hookout .7s ease forwards}
@keyframes hookout{to{opacity:0}}
#sil{position:absolute;left:50%;bottom:250px;width:660px;transform:translateX(-50%);
  filter:brightness(0) drop-shadow(0 0 26px rgba(255,190,60,.55));
  animation:silin 1.4s ease}
@keyframes silin{from{opacity:0;transform:translateX(-50%) scale(1.06)}to{opacity:1}}
#rim{position:absolute;left:50%;bottom:250px;width:660px;transform:translateX(-50%);
  mix-blend-mode:screen;opacity:.3;
  filter:brightness(1.9) saturate(0) sepia(1) hue-rotate(-12deg) drop-shadow(0 0 20px rgba(255,190,60,.8));
  animation:rimsweep 3.2s ease-in-out infinite}
@keyframes rimsweep{0%,100%{opacity:.16}50%{opacity:.42}}
#hookTxt{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:2}
#hookTxt .l1{font-size:50px;font-weight:900;color:#fff;letter-spacing:5px;line-height:1.42;
  text-shadow:0 3px 0 rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.95);
  animation:l1in 1.1s ease .25s both}
#hookTxt .l1 b{color:#ffd166;text-shadow:0 3px 0 rgba(90,40,4,.9),0 0 34px rgba(255,180,50,.9)}
@keyframes l1in{from{opacity:0;transform:translateY(-16px)}to{opacity:1}}
#hookTxt .l2{margin-top:26px;font-size:28px;font-weight:700;color:#e9d5a8;letter-spacing:3px;
  text-shadow:0 2px 8px #000;animation:l1in 1s ease 1.5s both}
#hookGo{position:absolute;left:0;right:0;bottom:120px;text-align:center;z-index:2;
  font-size:31px;font-weight:900;color:#ffe9a8;letter-spacing:4px;
  text-shadow:0 3px 0 #7a3c06,0 0 24px rgba(255,190,60,.9);
  animation:blink 1.3s ease-in-out infinite 1.8s both}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- 建築修復點 ---------- */
.spot{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;z-index:16;cursor:pointer}
.spot.done{pointer-events:none;animation:spotout .5s ease forwards}
@keyframes spotout{to{opacity:0;transform:scale(1.5)}}
.spot .ring{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,214,110,.9);
  box-shadow:0 0 22px rgba(255,190,60,.7),0 0 18px rgba(255,190,60,.5) inset;
  animation:spotp 1.6s ease-out infinite}
.spot .ring:nth-child(2){animation-delay:.8s}
@keyframes spotp{0%{transform:scale(.62);opacity:1}100%{transform:scale(1.08);opacity:0}}
.spot .core{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
  border-radius:50%;background:radial-gradient(circle at 36% 30%,rgba(255,248,220,.95),rgba(240,181,44,.85) 60%,rgba(164,103,12,.75));
  border:3px solid #fff2c8;box-shadow:0 0 20px rgba(255,200,80,.95);
  display:flex;align-items:center;justify-content:center;
  font-size:27px;font-weight:900;color:#5c3406}
.spot .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;
  margin-top:2px;font-size:23px;font-weight:900;color:#fff;letter-spacing:2px;
  text-shadow:0 0 4px #000,0 2px 6px #000}
.spot .meter{position:absolute;left:50%;top:-4px;transform:translateX(-50%);
  display:flex;gap:5px}
.spot .meter u{width:16px;height:7px;border-radius:4px;background:rgba(255,255,255,.28);
  border:1px solid rgba(255,214,110,.6)}
.spot .meter u.f{background:linear-gradient(90deg,#ffd166,#fff8dd);box-shadow:0 0 10px rgba(255,190,60,.9)}
.spot.hit .core{animation:corehit .22s ease}
@keyframes corehit{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}

/* 修復爆光 */
.rep{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  z-index:17;pointer-events:none;border:8px solid rgba(255,220,140,.95);
  box-shadow:0 0 46px rgba(255,190,60,.95);animation:repw .8s ease-out forwards}
@keyframes repw{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}
.mote{position:absolute;width:11px;height:11px;border-radius:50%;z-index:17;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fffbe6,#ffc63c 60%,rgba(224,138,16,0));
  box-shadow:0 0 14px rgba(255,200,80,.95)}
.float{position:absolute;z-index:30;font-size:34px;font-weight:900;color:#ffe27a;white-space:nowrap;
  text-shadow:0 2px 0 #6b3d06,0 0 14px rgba(255,190,60,.85);pointer-events:none;
  animation:fly 1.05s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-22px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-130px) scale(1)}}

/* ---------- 名將歸隊 ---------- */
#speech{position:absolute;left:26px;right:26px;bottom:298px;z-index:19;
  padding:12px 22px;border-radius:15px;opacity:0;
  background:linear-gradient(180deg,rgba(34,22,10,.95),rgba(12,8,4,.96));
  border:2px solid #c99a3c;box-shadow:0 0 0 1px rgba(255,230,170,.2) inset,0 10px 26px rgba(0,0,0,.7);
  transition:opacity .35s ease}
#speech.on{opacity:1;animation:spin2 .4s ease}
@keyframes spin2{from{transform:translateY(10px)}to{transform:none}}
#speech .who{font-size:23px;font-weight:900;color:#ffd166;letter-spacing:3px;margin-right:10px}
#speech .what{font-size:27px;font-weight:700;color:#f3e5c6}

#lineup{position:absolute;left:0;right:0;bottom:34px;height:250px;z-index:18;
  display:flex;align-items:flex-end;justify-content:center;gap:6px}
.slot{position:relative;width:232px;height:250px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end}
.slot .ph{position:absolute;bottom:52px;width:150px;height:150px;border-radius:50%;
  border:3px dashed rgba(190,180,165,.35);opacity:1;transition:opacity .4s}
.slot.in .ph{opacity:0}
.slot img{width:232px;display:block;opacity:0;transform:translateY(40px) scale(.94);
  filter:brightness(0) drop-shadow(0 10px 18px rgba(0,0,0,.85));
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,1.2,.4,1)}
.slot.in img{opacity:1;transform:none}
.slot.lit img{filter:drop-shadow(0 10px 22px rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(255,190,60,.55));
  transition:filter .55s ease}
.slot .tag{margin-top:-2px;padding:3px 14px;border-radius:10px;opacity:0;
  background:linear-gradient(180deg,rgba(30,19,8,.95),rgba(12,8,4,.95));
  border:2px solid #c99a3c;font-size:24px;font-weight:900;color:#ffe9a8;letter-spacing:4px;
  text-shadow:0 2px 0 #4a2205;transition:opacity .4s ease .3s}
.slot.in .tag{opacity:1}
.slot .flash{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,245,205,.95),rgba(255,190,60,0) 70%)}
.slot.pop .flash{animation:sflash .7s ease-out}
@keyframes sflash{0%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}

/* ---------- 完成橫幅 ---------- */
#done{position:absolute;left:0;right:0;top:40%;z-index:42;text-align:center;pointer-events:none;opacity:0}
#done.go{animation:doneb 2s ease-out}
@keyframes doneb{0%{opacity:0;transform:scale(.7)}
  15%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#done .b1{font-size:76px;font-weight:900;color:#ffe9a8;letter-spacing:8px;
  text-shadow:0 6px 0 #7a2b06,0 0 46px rgba(255,180,50,.95)}
#done .b2{margin-top:10px;font-size:34px;font-weight:900;color:#fff;letter-spacing:3px;
  text-shadow:0 3px 8px #000}

/* ---------- 結束卡 ---------- */
#end{position:absolute;inset:0;z-index:60;display:none;cursor:pointer;padding:0 46px;
  background:linear-gradient(180deg,rgba(8,5,3,.9),rgba(8,5,3,.97));
  flex-direction:column;align-items:center;justify-content:center}
#end.on{display:flex;animation:fadein .6s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#end .logo{width:470px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.85));
  animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{opacity:0;transform:scale(.75)}100%{opacity:1;transform:scale(1)}}
#end .kw{margin-top:24px;font-size:40px;font-weight:900;color:#fff;letter-spacing:3px;
  line-height:1.45;text-align:center;text-shadow:0 3px 10px #000}
#end .kw b{color:#ffd166;text-shadow:0 3px 0 #7a3c06,0 0 30px rgba(255,180,50,.8)}
#end .hl{margin-top:18px;font-size:44px;font-weight:900;color:#ffe9a8;letter-spacing:4px;
  text-shadow:0 4px 0 #7a3c06,0 0 32px rgba(255,190,60,.6)}
#gifts{margin-top:20px;display:flex;gap:12px}
.gift{flex:1;padding:12px 6px;border-radius:14px;text-align:center;
  background:linear-gradient(180deg,rgba(44,29,11,.96),rgba(15,10,5,.96));
  border:2px solid #c99a3c;box-shadow:0 0 0 1px rgba(255,230,170,.16) inset}
.gift .g1{font-size:26px;font-weight:900;color:#ffe9a8;letter-spacing:1px}
.gift .g2{margin-top:2px;font-size:19px;font-weight:700;color:#8ee08a}
#cta{margin-top:30px;width:100%;height:128px;border:none;border-radius:22px;font-family:inherit;
  background:linear-gradient(180deg,#ffe9a8 0%,#f5c33c 26%,#d98f1c 62%,#a35c07 100%);
  box-shadow:0 0 0 3px #7a4a0c,0 12px 0 #5b2f05,0 20px 40px rgba(0,0,0,.7),0 0 50px rgba(255,170,40,.5);
  font-size:52px;font-weight:900;color:#4a2205;letter-spacing:8px;cursor:pointer;
  text-shadow:0 2px 0 rgba(255,255,255,.45);animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.026)}}
#badges{margin-top:26px;display:flex;gap:22px;justify-content:center}
#badges img{height:72px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
#end .fine{margin-top:20px;font-size:19px;color:#9a8a72}
</style>
</head>
<body>
<div id="ASSETS" hidden
  data-guan="{{G_GUANYU}}" data-zhuge="{{G_ZHUGE}}" data-huang="{{G_HUANG}}"
  data-logo="{{LOGO}}" data-ios="{{IOS}}" data-gp="{{GP}}"></div>

<div id="stage">
  <div id="cityFull"></div>
  <div id="patches"></div>
  <div id="cityRuin"></div>
  <div id="dust"></div>
  <div id="vig"></div>

  <div id="hud">
    <div class="hrow"><span>城池修復 <span class="r" id="repTxt">0 / 6</span></span>
      <span>名將歸隊 <span class="r" id="genTxt">0 / 3</span></span></div>
    <div id="pbar"><div id="pfill"></div></div>
  </div>
  <img id="logoTop" data-a="logo" alt="霸王之業">

  <div id="spots"></div>

  <div id="speech"><span class="who" id="spWho">關 羽</span><span class="what" id="spWhat"></span></div>

  <div id="lineup">
    <div class="slot" id="slot0"><div class="ph"></div><div class="flash"></div>
      <img data-a="guan" alt="關羽"><div class="tag">關 羽</div></div>
    <div class="slot" id="slot1"><div class="ph"></div><div class="flash"></div>
      <img data-a="zhuge" alt="諸葛亮"><div class="tag">諸葛亮</div></div>
    <div class="slot" id="slot2"><div class="ph"></div><div class="flash"></div>
      <img data-a="huang" alt="皇甫嵩"><div class="tag">皇甫嵩</div></div>
  </div>

  <div id="done"><div class="b1">城池已復</div><div class="b2">三將歸位 ‧ 只等主公</div></div>

  <div id="hook">
    <img id="sil" data-a="guan" alt="">
    <img id="rim" data-a="guan" alt="">
    <div id="hookTxt">
      <div class="l1">主公，這座城<br>等了你<b>九年</b>。</div>
      <div class="l2">你的名將，一個都沒走。</div>
    </div>
    <div id="hookGo">點擊，修復你的城 ▸</div>
  </div>

  <div id="end">
    <img class="logo" data-a="logo" alt="霸王之業">
    <div class="kw">你的城與名將，<br><b>都為你保留著</b></div>
    <div class="hl">S87 旁親明德 ‧ 8/26 開服</div>
    <div id="gifts">
      <div class="gift"><div class="g1">名將試用</div><div class="g2">7 日</div></div>
      <div class="gift"><div class="g1">玄關羽</div><div class="g2">免費領</div></div>
      <div class="gift"><div class="g1">回歸禮包</div><div class="g2">登入即送</div></div>
    </div>
    <button id="cta">回歸領獎</button>
    <div id="badges"><img data-a="ios" alt="App Store"><img data-a="gp" alt="Google Play"></div>
    <div class="fine">三國群英傳－霸王之業 ‧ 遊戲畫面示意</div>
  </div>
</div>

<script>
/* ================= 素材指派（同一份 base64 供多處使用）================= */
(function(){
  var A=document.getElementById('ASSETS').dataset, im=document.querySelectorAll('img[data-a]');
  for(var i=0;i<im.length;i++) im[i].src=A[im[i].dataset.a];
})();

/* ================= 舞台縮放 ================= */
var STAGE_W=720, STAGE_H=1280, stage=document.getElementById('stage');
function fit(){ stage.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/STAGE_W,innerHeight/STAGE_H)+')' }
addEventListener('resize',fit); addEventListener('orientationchange',fit); fit();
var $=function(id){return document.getElementById(id)};

/* ================= 廣告 CTA（Meta / Google / IronSource / 通用） ================= */
var STORE_URL='https://play.google.com/store/apps/details?id=com.userjoy.rte&hl=zh_TW';
function clickThrough(){
  try{ if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;} }catch(e){}
  try{ if(window.ExitApi&&ExitApi.exit){ExitApi.exit();return;} }catch(e){}
  try{ if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;} }catch(e){}
  try{ if(window.dapi&&dapi.openStoreUrl){dapi.openStoreUrl();return;} }catch(e){}
  try{ window.open(STORE_URL,'_blank'); }catch(e){}
}

/* ================= 資料 ================= */
var TAPS=3;                 // 每棟建築要點幾下
var BUILDINGS=[
  {n:'宮 城',  x:300,y:296},
  {n:'兵 營',  x:520,y:404},
  {n:'集賢府', x:176,y:452},
  {n:'馬 廄',  x:248,y:636},
  {n:'工 坊',  x:566,y:664},
  {n:'計謀房', x:392,y:828}
];
var GENERALS=[
  {slot:0,name:'關 羽',  line:'主公一聲令下，關某即刻回營。'},
  {slot:1,name:'諸葛亮', line:'亮已備好方略，只待主公點兵。'},
  {slot:2,name:'皇甫嵩', line:'老夫的兵，一直沒散。'}
];
var G={fixed:0, gen:0, busy:false, over:false, started:false};

/* ================= 建立修復點 ================= */
BUILDINGS.forEach(function(b,i){
  var d=document.createElement('div');
  d.className='spot'; d.style.left=b.x+'px'; d.style.top=b.y+'px';
  d.innerHTML='<div class="ring"></div><div class="ring"></div>'+
    '<div class="meter">'+new Array(TAPS+1).join('<u></u>')+'</div>'+
    '<div class="core">修</div><div class="nm">'+b.n+'</div>';
  d.dataset.i=i; d.dataset.hit='0';
  d.addEventListener('pointerdown',function(){ tapSpot(d,i) });
  $('spots').appendChild(d);
  // 對應的彩色補丁
  var p=document.createElement('div');
  p.className='patch';
  p.style.left=(b.x-180)+'px'; p.style.top=(b.y-180)+'px';
  p.style.backgroundPosition=(-(b.x-180))+'px '+(-(b.y-180))+'px';
  p.dataset.i=i;
  $('patches').appendChild(p);
});

/* 蒙塵微粒 */
(function(){
  var d=$('dust');
  for(var i=0;i<14;i++){
    var m=document.createElement('i');
    m.style.left=(4+Math.random()*92)+'%';
    m.style.top=(30+Math.random()*60)+'%';
    m.style.animationDelay=(Math.random()*9)+'s';
    m.style.animationDuration=(7+Math.random()*6)+'s';
    d.appendChild(m);
  }
})();

/* ================= 開場鉤子 ================= */
function startGame(){
  if(G.started) return; G.started=true;
  var h=$('hook');
  h.classList.add('fade');
  setTimeout(function(){ h.classList.add('off') },700);
  $('hud').classList.add('on');
  render();
}
$('hook').addEventListener('pointerdown',startGame);
setTimeout(startGame,4200);        // 沒動作也自動進入

/* ================= 修復 ================= */
function tapSpot(el,i){
  if(G.busy||G.over) return;
  if(!G.started){ startGame(); return }
  var hit=(+el.dataset.hit)+1; el.dataset.hit=hit;
  var us=el.querySelectorAll('.meter u');
  if(us[hit-1]) us[hit-1].classList.add('f');
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  sparkAt(BUILDINGS[i].x,BUILDINGS[i].y,4);
  if(hit>=TAPS) finishSpot(el,i);
}

function finishSpot(el,i){
  el.classList.add('done');
  var p=$('patches').querySelector('.patch[data-i="'+i+'"]');
  if(p) p.classList.add('on');
  G.fixed++;

  var w=document.createElement('div'); w.className='rep';
  w.style.left=BUILDINGS[i].x+'px'; w.style.top=BUILDINGS[i].y+'px';
  $('spots').appendChild(w); setTimeout(function(){w.remove()},820);
  sparkAt(BUILDINGS[i].x,BUILDINGS[i].y,14);
  floatText(BUILDINGS[i].n.replace(/ /g,'')+' 已復',BUILDINGS[i].x,BUILDINGS[i].y-70);

  // 廢墟蒙層隨進度變淡
  $('cityRuin').style.opacity=Math.max(0,1-G.fixed/BUILDINGS.length*1.05).toFixed(3);
  $('dust').style.opacity=Math.max(0,1-G.fixed/BUILDINGS.length*1.3).toFixed(3);
  render();

  // 每兩棟 → 一位名將歸隊
  if(G.fixed%2===0 && G.gen<GENERALS.length) setTimeout(returnGeneral,520);
  else if(G.fixed>=BUILDINGS.length) setTimeout(allDone,900);
}

function sparkAt(x,y,n){
  if(!Element.prototype.animate) return;
  for(var i=0;i<n;i++){
    var m=document.createElement('div'); m.className='mote';
    m.style.left=x+'px'; m.style.top=y+'px';
    $('spots').appendChild(m);
    var a=Math.PI*2/n*i+Math.random()*.4, d=70+Math.random()*150, du=520+Math.random()*380;
    try{ m.animate([
      {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
      {transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d-40)+'px)) scale(1)',opacity:0}
    ],{duration:du,easing:'cubic-bezier(.2,.7,.3,1)'}); }catch(e){}
    setTimeout(function(el){return function(){el.remove()}}(m),du+60);
  }
}
function floatText(t,x,y){
  var d=document.createElement('div'); d.className='float'; d.textContent=t;
  d.style.left=x+'px'; d.style.top=y+'px';
  stage.appendChild(d); setTimeout(function(){d.remove()},1080);
}

/* ================= 名將歸隊 ================= */
function returnGeneral(){
  var g=GENERALS[G.gen]; if(!g) return;
  G.gen++; G.busy=true;
  var s=$('slot'+g.slot);
  s.classList.add('in','pop');
  setTimeout(function(){ s.classList.add('lit') },420);   // 剪影 → 亮起
  $('spWho').textContent=g.name;
  $('spWhat').textContent=g.line;
  $('speech').classList.add('on');
  render();
  setTimeout(function(){
    G.busy=false;
    if(G.fixed>=BUILDINGS.length) allDone();
  },1250);
  setTimeout(function(){ $('speech').classList.remove('on') },2600);
}

/* ================= 完成 → 結束卡 ================= */
function allDone(){
  if(G.over) return;
  G.over=true;
  // 沒歸隊的補齊
  while(G.gen<GENERALS.length){
    var g=GENERALS[G.gen++]; var s=$('slot'+g.slot);
    s.classList.add('in','lit');
  }
  $('cityRuin').style.opacity=0;
  $('dust').style.opacity=0;
  $('speech').classList.remove('on');
  var d=$('done'); d.classList.remove('go'); void d.offsetWidth; d.classList.add('go');
  render();
  setTimeout(function(){ $('end').classList.add('on') },2000);
}

function render(){
  $('repTxt').textContent=G.fixed+' / '+BUILDINGS.length;
  $('genTxt').textContent=G.gen+' / '+GENERALS.length;
  $('pfill').style.width=(G.fixed/BUILDINGS.length*100)+'%';
}

$('end').addEventListener('click',clickThrough);
$('cta').addEventListener('click',function(e){e.stopPropagation();clickThrough()});
render();
</script>
</body>
</html>
